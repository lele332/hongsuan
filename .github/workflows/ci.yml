# P4.2 CI：语法/数据校验 + Windows 无头 Electron 黄金回归
# electron 二进制不进仓库，CI 从 npmmirror 拉取与 electronVersion 一致的运行时；
# HS_SAFE_MODE=1 复用 P0 兼容模式（CI 虚拟机无 GPU 保证）。
name: ci

on:
  push:
    paths:
      - "portable/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "portable/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax checks
        run: |
          node --check portable/main.js
          node --check portable/preload.js
          node --check portable/libs/hs-libs-loader.js
          node --check portable/tests/core-golden.cjs
      - name: Data validity
        run: |
          node -e "JSON.parse(require('fs').readFileSync('portable/tests/golden-cases.json','utf8')); console.log('golden OK')"
          node -e "JSON.parse(require('fs').readFileSync('portable/package.json','utf8')); console.log('pkg OK')"

  desktop-golden:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read electron version
        id: ver
        shell: bash
        run: echo "v=$(node -p "JSON.parse(require('fs').readFileSync('portable/package.json','utf8')).build.electronVersion")" >> $GITHUB_OUTPUT

      - name: Install runtime dependencies
        working-directory: portable
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm ci --omit=dev --ignore-scripts

      - name: Download Electron runtime
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.v }}"
          $zip = Join-Path $env:RUNNER_TEMP "electron.zip"
          $url = "https://registry.npmmirror.com/-/binary/electron/$v/electron-v$v-win32-x64.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $dest = Join-Path $env:RUNNER_TEMP "electron-runtime"
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          if (-not (Test-Path (Join-Path $dest "electron.exe"))) { throw "Electron runtime not found after download" }
      - name: Run desktop golden regression
        shell: pwsh
        run: |
          $env:HS_SAFE_MODE = "1"
          $app = (Resolve-Path "portable").Path
          $exe = Join-Path $env:RUNNER_TEMP "electron-runtime\electron.exe"
          $proc = Start-Process -FilePath $exe -ArgumentList @("`"$app`"", "--remote-debugging-port=9222") -PassThru
          $ready = $false
          foreach ($i in 1..60) {
            Start-Sleep -Seconds 1
            try {
              $targets = Invoke-RestMethod -Uri "http://127.0.0.1:9222/json/list" -TimeoutSec 2
              if ($targets | Where-Object { $_.type -eq "page" }) { $ready = $true; break }
            } catch {}
          }
          if (-not $ready) {
            try { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue } catch {}
            throw "Electron CDP did not become ready"
          }
          node portable/tests/core-golden.cjs 9222
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          try { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue } catch {}
