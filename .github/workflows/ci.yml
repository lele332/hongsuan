name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build (build-info + SW cache version)
        run: npm run build
      - name: Check (dynamic JS syntax + SW precache integrity)
        run: npm run check
      - name: Static smoke
        run: npm run smoke
